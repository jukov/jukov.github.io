<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="panel">
            <div id="record-block">
                <div class="label">РЕК. ОБОБЫ</div>
                <div id="record">5 709</div>
            </div>
            <div class="stat">
                <div class="label">SCORE</div>
                <div id="score">0</div>
            </div>
            <div class="stat">
                <div class="label">LEVEL</div>
                <div id="level">1</div>
            </div>
            <div class="stat">
                <div class="label">LINES</div>
                <div id="lines">0</div>
            </div>
            <div class="stat">
                <div class="label">NEXT</div>
                <div id="next-list">
                    <canvas class="next-canvas" width="120" height="60"></canvas>
                    <canvas class="next-canvas" width="120" height="60"></canvas>
                    <canvas class="next-canvas" width="120" height="60"></canvas>
                </div>
            </div>
            <div id="controls">
                <div>← → &nbsp;сдвиг</div>
                <div>↓ &nbsp;&nbsp;&nbsp;мягкое падение</div>
                <div>↑ / X &nbsp;поворот ↻</div>
                <div>Z &nbsp;&nbsp;&nbsp;&nbsp;поворот ↺</div>
                <div>Space &nbsp;хард-дроп</div>
                <div>P / Esc пауза</div>
                <div>Enter &nbsp;рестарт</div>
            </div>
        </div>
    </div>
    <div id="overlay" class="hidden">
        <div id="overlay-content">
            <div id="overlay-title"></div>
            <div id="overlay-sub"></div>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>
</html>
